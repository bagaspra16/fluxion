<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Fluxion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="assets/js/form-validation.js"></script>
    <style>
        /* Full page standalone auth design with proper centering and scrolling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            min-height: 100%;
            background: #0a0a0a;
            padding: 60px 20px;
            overflow-x: hidden;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #00ff88;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            gap: 12px;
            color: #00cc6a;
        }
    </style>
</head>

<body class="page-with-effect">
    <div class="auth-wrapper">
        <a href="index.html" class="back-home">
            <i class="fas fa-arrow-left"></i>
            Back to Fluxion
        </a>

        <div class="form-container">
            <div class="form-header">
                <h1><i class="fas fa-key"></i> Reset Password</h1>
                <p>Enter your email to receive reset instructions</p>
            </div>

            <form class="validation-form" id="forgotPasswordForm"
                data-success-message="Password reset link sent to your email!">
                <div class="form-group">
                    <label for="resetEmail">Email Address <span class="required">*</span></label>
                    <input type="email" id="resetEmail" name="resetEmail" class="form-control"
                        placeholder="your@email.com" required>
                    <div class="validation-message error-message"></div>
                    <div class="validation-message success-message"></div>
                    <div class="hint-text">Enter the email associated with your account</div>
                </div>

                <div class="form-group">
                    <label for="securityQuestion">Security Question</label>
                    <select id="securityQuestion" name="securityQuestion" class="form-control" required>
                        <option value="">Select a security question</option>
                        <option value="pet">What was the name of your first pet?</option>
                        <option value="city">In what city were you born?</option>
                        <option value="school">What was the name of your elementary school?</option>
                        <option value="car">What was your first car?</option>
                        <option value="friend">What is your best friend's nickname?</option>
                    </select>
                    <div class="validation-message error-message"></div>
                    <div class="hint-text">Choose a security question for verification</div>
                </div>

                <div class="form-group">
                    <label for="securityAnswer">Security Answer <span class="required">*</span></label>
                    <input type="text" id="securityAnswer" name="securityAnswer" class="form-control"
                        placeholder="Enter your answer" required>
                    <div class="validation-message error-message"></div>
                    <div class="hint-text">Enter the answer to your security question</div>
                </div>

                <button type="submit" class="btn-submit">
                    <span class="spinner"></span>
                    <span class="btn-text">Send Reset Link</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>

            <div class="form-links">
                Remember your password? <a href="login.html">Sign In</a>
                <br><br>
                Need help? <a href="contact.html">Contact Support</a>
            </div>
        </div>
    </div>
</body>

</html>

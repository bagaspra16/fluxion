<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Header</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/jquery.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            height: 80px;
            overflow: hidden;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 80px;
        }

        .logo {
            color: #00ff88;
            font-size: 28px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo i {
            margin-right: 8px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Guest Buttons */
        .auth-buttons {
            display: flex;
            gap: 10px;
        }

        .login-btn,
        .signup-btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .login-btn {
            background: transparent;
            border: 2px solid #00ff88;
            color: #00ff88;
        }

        .signup-btn {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            border: none;
            color: #0a0a0a;
        }

        /* Logged In User */
        .user-profile {
            display: none;
            align-items: center;
            gap: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 700;
            font-size: 16px;
        }

        .user-name {
            color: #fff;
            font-weight: 600;
            font-size: 14px;
        }

        .logout-btn {
            background: transparent;
            border: 2px solid #ff4444;
            color: #ff4444;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .logout-btn:hover {
            background: rgba(255, 68, 68, 0.1);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="header-container">
        <div class="logo-section">
            <a href="home.html" target="content" class="logo">
                <i class="fas fa-play-circle"></i>Fluxion
            </a>
        </div>

        <div class="user-section">
            <!-- Guest Buttons -->
            <div class="auth-buttons" id="guestButtons">
                <a href="login.html" target="_blank" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </a>
                <a href="register.html" target="_blank" class="signup-btn">
                    <i class="fas fa-user-plus"></i> Sign Up
                </a>
            </div>

            <!-- Logged In User -->
            <div class="user-profile" id="userProfile">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar"></div>
                    <span class="user-name" id="userName"></span>
                </div>
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </div>

    <script>
        function updateAuthUI(user) {
            const guestButtons = document.getElementById('guestButtons');
            const userProfile = document.getElementById('userProfile');
            const userName = document.getElementById('userName');
            const userAvatar = document.getElementById('userAvatar');

            if (user) {
                guestButtons.style.display = 'none';
                userProfile.style.display = 'flex';
                userName.textContent = user.fullName || user.username;

                const initial = (user.fullName || user.username).charAt(0).toUpperCase();
                userAvatar.textContent = initial;
            } else {
                guestButtons.style.display = 'flex';
                userProfile.style.display = 'none';
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', function () {
            if (confirm('Are you sure you want to logout?')) {
                if (window.parent && window.parent.FluxionAuth) {
                    window.parent.FluxionAuth.logout();
                }
            }
        });

        window.addEventListener('load', function () {
            if (window.parent && window.parent.FluxionAuth) {
                const currentUser = window.parent.FluxionAuth.getCurrentUser();
                updateAuthUI(currentUser);
            }
        });

        window.updateAuthUI = updateAuthUI;
    </script>
</body>

</html>
